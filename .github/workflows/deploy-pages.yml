name: Deploy website to GitHub Pages
# Force a fresh Pages deployment after publishing-source changes.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract website files
        run: |
          rm -rf _site
          mkdir -p _site
          unzip -q "Isabellay07-island-latest-github-pages-github25mb.zip" -d _site
          test -f _site/index.html

          # GitHub Pages serves this site under /isaart/ rather than domain root.
          # Rewrite root-absolute asset URLs so the existing Vite build works there.
          find _site -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.map' \) -print0 | xargs -0 sed -i 's#/assets/#/isaart/assets/#g'
          find _site -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 | xargs -0 sed -i 's#/favicon.svg#/isaart/favicon.svg#g'

          echo "Website files:"
          find _site -maxdepth 2 -type f | head -50

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
